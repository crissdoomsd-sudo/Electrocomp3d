<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroComp-3D | Explorador de Componentes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>⚡ ElectroComp-3D</h1>
    <p>Explora componentes electrónicos en 3D</p>
  </header>

  <main class="container">
    <aside class="sidebar">
      <h2>📦 Componentes</h2>
      <ul id="component-list"></ul>
    </aside>

    <section class="viewer-area">
      <div id="canvas-container"></div>
      <div class="controls">
        <button id="btn-reset">🔄 Reset Vista</button>
        <button id="btn-compare">⚖️ Comparar</button>
        <button id="btn-screenshot">📸 Captura</button>
      </div>
    </section>

    <section class="details-panel">
      <h2 id="comp-title">Selecciona un componente</h2>
      <div id="comp-info">
        <p>Haz clic en cualquier componente de la lista para ver sus detalles y modelo 3D.</p>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/viewer.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
